<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>赛博起卦</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="ink-wash"></div>
    <div class="cloud cloud-l"></div>
    <div class="cloud cloud-r"></div>
    <div class="noise"></div>
  </div>

  <main class="stage">
    <header class="brand">
      <p class="brand-tag">易 · 数 · 象</p>
      <h1 class="brand-title">赛博起卦</h1>
      <p class="brand-sub">心中默念一事，点击起卦</p>
    </header>

    <section class="oracle" aria-label="起卦仪">
      <div class="core" id="core">
        <svg class="bagua" viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <linearGradient id="castGrad" gradientUnits="userSpaceOnUse" x1="20" y1="20" x2="180" y2="180">
              <stop class="grad-a" offset="0%" stop-color="#c9a15b">
                <animate attributeName="stop-color" values="#c9a15b;#c23a2b;#3d8b74;#f2e6d4;#c9a15b" dur="1.6s" repeatCount="indefinite" />
              </stop>
              <stop class="grad-b" offset="35%" stop-color="#c23a2b">
                <animate attributeName="stop-color" values="#c23a2b;#3d8b74;#f2e6d4;#c9a15b;#c23a2b" dur="1.6s" repeatCount="indefinite" />
              </stop>
              <stop class="grad-c" offset="70%" stop-color="#3d8b74">
                <animate attributeName="stop-color" values="#3d8b74;#f2e6d4;#c9a15b;#c23a2b;#3d8b74" dur="1.6s" repeatCount="indefinite" />
              </stop>
              <stop class="grad-d" offset="100%" stop-color="#f2e6d4">
                <animate attributeName="stop-color" values="#f2e6d4;#c9a15b;#c23a2b;#3d8b74;#f2e6d4" dur="1.6s" repeatCount="indefinite" />
              </stop>
              <animateTransform
                attributeName="gradientTransform"
                type="rotate"
                from="0 100 100"
                to="360 100 100"
                dur="1.6s"
                repeatCount="indefinite"
              />
            </linearGradient>
          </defs>
          <circle cx="100" cy="100" r="94" fill="none" stroke="currentColor" stroke-width="0.6" opacity="0.35" />
          <circle cx="100" cy="100" r="72" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.22" stroke-dasharray="2 3" />
          <g class="bagua-marks" font-size="10" text-anchor="middle" dominant-baseline="central">
            <text x="100" y="16">乾</text>
            <text x="158" y="42">巽</text>
            <text x="184" y="100">离</text>
            <text x="158" y="158">坤</text>
            <text x="100" y="184">兑</text>
            <text x="42" y="158">艮</text>
            <text x="16" y="100">坎</text>
            <text x="42" y="42">震</text>
          </g>
        </svg>

        <div class="taiji" aria-hidden="true">
          <div class="taiji-half"></div>
        </div>

        <div class="hexagram" id="hexagram" aria-hidden="true">
          <span class="yao" data-i="0"></span>
          <span class="yao" data-i="1"></span>
          <span class="yao" data-i="2"></span>
          <span class="yao" data-i="3"></span>
          <span class="yao" data-i="4"></span>
          <span class="yao" data-i="5"></span>
        </div>
        <p class="status" id="status">静候天机</p>
      </div>

      <div class="actions">
        <button type="button" id="castBtn" class="cast-btn">
          <span class="cast-btn-ornament" aria-hidden="true">◈</span>
          <span class="cast-btn-label">起卦</span>
          <span class="cast-btn-ornament" aria-hidden="true">◈</span>
        </button>
      </div>

      <div class="verdict" id="verdict" aria-live="polite" hidden>
        <div class="seal" id="seal" aria-hidden="true">
          <span id="sealText"></span>
        </div>
        <p class="verdict-level" id="verdictLevel"></p>
        <p class="verdict-name" id="verdictName"></p>
        <p class="verdict-text" id="verdictText"></p>
      </div>
    </section>
  </main>

  <script src="hexagrams.js"></script>
  <script src="app.js"></script>
</body>
</html>
